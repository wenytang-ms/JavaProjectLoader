name: Java provider T1 matrix

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project id from lab/t1-projects.json, or all 20 configured cases"
        required: true
        default: all
        type: string
      provider:
        description: "Java language provider"
        required: true
        default: all
        type: choice
        options:
          - all
          - jdtls
          - intellij
      operating_system:
        description: "GitHub-hosted runner image"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-latest
          - macos-latest

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
      providers: ${{ steps.matrix.outputs.providers }}
      operating_systems: ${{ steps.matrix.outputs.operating_systems }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: matrix
        name: Build requested matrix
        shell: bash
        run: |
          node lab/t1-action/create-matrix.mjs \
            --project "${{ inputs.project }}" \
            --provider "${{ inputs.provider }}" \
            --os "${{ inputs.operating_system }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  t1:
    name: T1 / ${{ matrix.project.id }} / ${{ matrix.provider }} / ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      T1_OUTPUT_DIR: ${{ github.workspace }}/lab/t1-action/results/${{ matrix.project.id }}/${{ matrix.provider }}/${{ matrix.os }}
      T1_OPERATING_SYSTEM: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/t1-action/package-lock.json

      - name: Set up project JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.environment.projectJavaDistribution }}
          java-version: ${{ matrix.environment.projectJavaVersion }}

      - name: Record project JDK home
        shell: pwsh
        run: |
          "T1_PROJECT_JAVA_HOME=$env:JAVA_HOME" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up provider runtime JDK
        if: matrix.environment.runtimeJavaSource == 'setup-java'
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.environment.runtimeJavaDistribution }}
          java-version: ${{ matrix.environment.runtimeJavaVersion }}

      - name: Record provider runtime JDK
        if: matrix.environment.runtimeJavaSource == 'setup-java'
        shell: pwsh
        run: |
          "T1_LANGUAGE_SERVER_JAVA_HOME=$env:JAVA_HOME" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Android SDK tooling JDK
        if: matrix.environment.requiresAndroidSdk == true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Record Android SDK tooling JDK
        if: matrix.environment.requiresAndroidSdk == true
        shell: pwsh
        run: |
          "T1_ANDROID_SDK_JAVA_HOME=$env:JAVA_HOME" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up declared project environment
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "t1-project-environment-${{ matrix.project.id }}.json"
          "T1_PROJECT_ENVIRONMENT_RESULT=$resultPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node lab/t1-action/project-environment.mjs `
            --project "${{ matrix.project.id }}" `
            --provider "${{ matrix.provider }}" `
            --result $resultPath

      - name: Install T1 runner
        working-directory: lab/t1-action
        run: npm ci

      - name: Run T1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node lab\t1-action\run-t1-autotest.mjs `
            --project "${{ matrix.project.id }}" `
            --provider "${{ matrix.provider }}"

      - name: Run T1 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node lab/t1-action/run-t1-autotest.mjs \
            --project "${{ matrix.project.id }}" \
            --provider "${{ matrix.provider }}"

      - name: Upload T1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-${{ matrix.project.id }}-${{ matrix.provider }}-${{ runner.os }}
          path: ${{ env.T1_OUTPUT_DIR }}
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 6
          retention-days: 14

  aggregate:
    name: Aggregate T1 conclusion
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs:
      - prepare
      - t1
    runs-on: ubuntu-latest
    env:
      T1_MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download T1 evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: t1-*
          path: lab/t1-action/aggregate-input
          merge-multiple: false

      - name: Build aggregate conclusion
        run: |
          node lab/t1-action/summarize-results.mjs \
            --results lab/t1-action/aggregate-input \
            --output lab/t1-action/aggregate-output \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate conclusion
        uses: actions/upload-artifact@v4
        with:
          name: t1-aggregate-conclusion
          path: lab/t1-action/aggregate-output
          if-no-files-found: error
          retention-days: 30
