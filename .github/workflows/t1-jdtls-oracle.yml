name: JDT LS versus Oracle T1 comparison
run-name: JDT LS vs Oracle / ${{ inputs.project_count || '10' }} projects / ${{ inputs.operating_system || 'windows-latest' }}

on:
  workflow_dispatch:
    inputs:
      project_count:
        description: "Number of smallest non-dismissed projects to compare"
        required: true
        default: "10"
        type: string
      projects:
        description: "Optional comma-separated project ids; overrides project_count"
        required: false
        default: ""
        type: string
      operating_system:
        description: "Runner operating system"
        required: true
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - macos-latest
      vscode_version:
        description: "Exact shared VS Code version for the comparison"
        required: true
        default: "1.136.1"
        type: string
      exclude_cases:
        description: "Comma-separated project:provider:os cases to omit"
        required: false
        default: ""
        type: string
      environment_mode:
        description: "Load per-case JSON environment versions, or opt into the legacy native prebuild"
        required: true
        default: configured-source
        type: choice
        options:
          - prebuilt-workspace
          - configured-source

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      qualification_matrix: ${{ steps.matrix.outputs.qualification_matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: matrix
        name: Build JDT LS and Oracle comparison matrix
        shell: bash
        env:
          T1_ENVIRONMENT_MODE: ${{ inputs.environment_mode || 'configured-source' }}
        run: |
          node lab/t1-action/create-jdtls-oracle-matrix.mjs \
            --project-count "${{ inputs.project_count || '10' }}" \
            --projects "${{ inputs.projects || '' }}" \
            --os "${{ inputs.operating_system || 'windows-latest' }}" \
            --exclude "${{ inputs.exclude_cases || '' }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  qualify:
    needs: prepare
    uses: ./.github/workflows/t1-environment-qualification.yml
    with:
      matrix: ${{ needs.prepare.outputs.qualification_matrix }}
      environment_mode: ${{ inputs.environment_mode || 'configured-source' }}

  compare:
    name: Compare / ${{ matrix.project.id }} / ${{ matrix.provider }}
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs:
      - prepare
      - qualify
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      T1_OUTPUT_DIR: ${{ github.workspace }}/lab/t1-action/results/${{ matrix.project.id }}/${{ matrix.provider }}/${{ matrix.os }}
      T1_OPERATING_SYSTEM: ${{ matrix.os }}
      T1_MIN_TIMEOUT_SECONDS: "1800"
      T1_VSCODE_VERSION: ${{ inputs.vscode_version || '1.136.1' }}
      T1_REQUIRE_ENVIRONMENT_READY: "1"
      T1_ENVIRONMENT_MODE: ${{ inputs.environment_mode || 'configured-source' }}
      T1_ENVIRONMENT_DIRECTORY: ${{ github.workspace }}/.local-t1/environment/${{ matrix.project.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/t1-action/package-lock.json

      - name: Install T1 runner
        working-directory: lab/t1-action
        run: npm ci

      - name: Download independently qualified environment
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: t1-environment-${{ matrix.project.id }}-${{ matrix.os }}
          path: ${{ env.T1_ENVIRONMENT_DIRECTORY }}

      - id: environment
        name: Replay the locked project environment
        continue-on-error: true
        uses: ./.github/actions/t1-environment
        with:
          project: ${{ matrix.project.id }}
          operating-system: ${{ matrix.os }}
          directory: ${{ env.T1_ENVIRONMENT_DIRECTORY }}
          locked: "true"

      - name: Prepare the locked environment before starting the provider
        if: steps.environment.outcome == 'success' && steps.environment.outputs.state != 'ENV_BLOCKED'
        continue-on-error: true
        shell: pwsh
        env:
          T1_PROJECT: ${{ matrix.project.id }}
        run: |
          node (Join-Path "lab" "t1-action" "environment-workflow.mjs") `
            --phase replay --project $env:T1_PROJECT --os $env:T1_OPERATING_SYSTEM `
            --directory $env:T1_ENVIRONMENT_DIRECTORY

      - name: Run provider T1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node lab\t1-action\run-t1-autotest.mjs `
            --project "${{ matrix.project.id }}" `
            --provider "${{ matrix.provider }}"

      - name: Run provider T1 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node lab/t1-action/run-t1-autotest.mjs \
            --project "${{ matrix.project.id }}" \
            --provider "${{ matrix.provider }}"

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdtls-oracle-${{ matrix.project.id }}-${{ matrix.provider }}-${{ runner.os }}
          path: ${{ env.T1_OUTPUT_DIR }}
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 6
          retention-days: 14

  aggregate:
    name: Build JDT LS and Oracle comparison
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs:
      - prepare
      - compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download provider evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: jdtls-oracle-*
          path: lab/t1-action/comparison-input
          merge-multiple: false

      - name: Build paired comparison
        run: |
          node lab/t1-action/summarize-jdtls-oracle.mjs \
            --results lab/t1-action/comparison-input \
            --output lab/t1-action/comparison-output \
            --project-count "${{ inputs.project_count || '10' }}" \
            --projects "${{ inputs.projects || '' }}" \
            --os "${{ inputs.operating_system || 'windows-latest' }}" \
            --exclude "${{ inputs.exclude_cases || '' }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: jdtls-oracle-comparison
          path: lab/t1-action/comparison-output
          if-no-files-found: error
          retention-days: 30
